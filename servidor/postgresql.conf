# Ajustes de PostgreSQL para BalanceRT (preparar.sh lo copia a /etc/postgresql/17/main/conf.d/balancert.conf).
# Servidor de 2 GB con la app (que se reinicia si pasa 700 MB): la base se queda con un cuarto para tener
# en memoria lo más usado. Cambiar shared_buffers o shared_preload_libraries pide reiniciar PostgreSQL.
listen_addresses = '127.0.0.1'
max_connections = 30
shared_buffers = 512MB
effective_cache_size = 1280MB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 16MB
random_page_cost = 1.1
timezone = 'UTC'
# JIT compila las consultas grandes: con tablas de miles de filas tarda más compilar que consultar
jit = off
# qué consultas pesan en producción (CLAUDE.md: medir antes de dar por bueno)
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 500
