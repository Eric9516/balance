# Nginx: publica la app de Next (127.0.0.1:3000). certbot agrega el HTTPS a este mismo archivo.
# preparar.sh pone el dominio.

# Los pedidos que cambian algo (POST: las acciones del servidor y entrar) se cuentan por dirección: hasta
# 10 por segundo, con margen para ráfagas. Un estudio entero detrás de una misma dirección no llega; un
# programa que martilla, sí, y se frena acá sin tocar la app.
map $request_method $post_por_direccion { POST $binary_remote_addr; default ""; }
limit_req_zone $post_por_direccion zone=acciones:10m rate=10r/s;

# Cualquier pedido que no venga a nuestro dominio (por la IP o con otro nombre) se corta sin respuesta:
# así nadie puede hacerle creer a la app que está en otra dirección.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    client_max_body_size 20m;

    # lo que arma Next y nunca cambia (lleva la huella en el nombre): que el navegador lo guarde un año
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=acciones burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
