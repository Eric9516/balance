# Configuración de pnpm para BalanceRT (no es un monorepo: no hay "packages").

# Scripts de instalación: pnpm los bloquea salvo que estén autorizados acá.
allowBuilds:
  # Preparan el motor de esquema que usan las migraciones.
  '@prisma/engines': true
  prisma: true
  # Solo compilan desde cero si falta el binario ya armado de la plataforma, que viene como dependencia opcional.
  sharp: false
  unrs-resolver: false
  # PostgreSQL real para medir rendimiento (pnpm rendimiento): su instalación arma los archivos del programa.
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true

# Cadena de suministro: no instalar versiones publicadas hace menos de 3 días (en minutos).
# Una versión comprometida suele detectarse y retirarse en ese plazo.
minimumReleaseAge: 4320

# Versiones corregidas de dependencias internas de Next (herramientas de compilación) con fallas conocidas.
# Quitar cada una cuando Next ya traiga una versión igual o mayor.
overrides:
  browserslist: '^4.28.7' # GHSA de crecimiento de memoria y escritura de prototipo
  baseline-browser-mapping: '^2.11.0' # GHSA-w5vr-8v7q-w6rv: corte del proceso con entrada inválida
